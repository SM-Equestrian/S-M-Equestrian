async function resolveCloud(useLocal){if(!blocked||busy)return;if(!confirm(useLocal?'Lokale Daten als neuen Cloud-Stand speichern? Bitte vorher beide Stände sichern.':'Cloud-Stand übernehmen und lokale Änderungen verwerfen? Bitte vorher lokale Daten exportieren.'))return;try{let row=await remote();base=row?.updated_at??null;if(!useLocal){db=row?.data||Object.fromEntries(Object.keys(schemas).map(k=>[k,[]]));dirty=false}else dirty=true;blocked=false;$('cloudConflict').hidden=true;persist();page='home';render();if(dirty)flush();else status('✓ Cloud-Stand übernommen')}catch(e){status('Konflikt konnte nicht gelöst werden.')}}
async function cloudSignOut(){if(busy||dirty){alert('Bitte zuerst alle Änderungen synchronisieren oder eine Sicherung exportieren.');return}await client.auth.signOut();location.reload()}
async function initCloud(){lock('Anmeldung wird vorbereitet …');try{if(!window.supabase)throw Error('Bibliothek konnte nicht geladen werden');client=window.supabase.createClient(cloudURL,cloudKey);$('loginForm').onsubmit=async e=>{e.preventDefault();let btn=$('loginButton');btn.disabled=true;status('Anmeldung läuft …');try{let {data,error}=await client.auth.signInWithPassword({email:$('loginEmail').value.trim(),password:$('loginPassword').value});if(error)throw error;$('loginPassword').value='';await start(data.session)}catch(e){status('Anmeldung fehlgeschlagen. Bitte E-Mail und Passwort prüfen.')}finally{btn.disabled=false}};let {data,error}=await client.auth.getSession();if(error)throw error;if(data.session)await start(data.session);else status('Bitte mit deinem persönlichen Konto anmelden.');}catch(e){status('Anmeldung nicht verfügbar. Bitte Internetverbindung prüfen.');$('retryLogin').hidden=false}}
window.addEventListener('online',retryCloud);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&ready&&!editor.open)retryCloud()});

initCloud();
</script></body></html>
