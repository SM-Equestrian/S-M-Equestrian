<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4eee5"><meta name="apple-mobile-web-app-capable" content="yes"><title>S&M Equestrian</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f0e8;color:#342e28;font:16px -apple-system,BlinkMacSystemFont,system-ui,sans-serif}header{padding:24px 20px 18px;background:#e8ddcc;border-bottom:1px solid #d7c9b6}header small{letter-spacing:4px;font-size:10px}h1,h2,h3{font-family:Georgia,serif;font-weight:400;margin:8px 0}h1{font-size:32px}h2{font-size:29px}h3{font-size:21px}p{line-height:1.5}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:#655443;color:white}button.secondary{background:#eee5d8;color:#493d30}button.danger{background:#f4e5de;color:#873e32}main{max-width:1050px;margin:auto;padding:20px 16px 100px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.tile,.panel{background:#fffdf8;border:1px solid #e5dacc;border-radius:17px;padding:17px;margin:0 0 12px;box-shadow:0 3px 12px #59432b08}.tile{text-align:left;color:#342e28;min-height:100px}.tile b{display:block;font-size:24px;font-family:Georgia;font-weight:400}.muted{color:#756b60;font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}nav{position:fixed;bottom:0;left:0;right:0;background:#fffdf8;border-top:1px solid #e5dacc;display:flex;justify-content:center;padding:6px 0 calc(8px + env(safe-area-inset-bottom));z-index:5}nav button{background:none;color:#76675a;flex:1;max-width:200px;font-size:12px;padding:7px 2px}nav button span{display:block;font-size:22px}nav button.active{color:#30271e;font-weight:700;background:#f2e9dc}label{display:block;font-size:13px;color:#62584c;margin:12px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #d8cbb9;border-radius:9px;background:#fffdf9;color:#342e28;font-size:16px}textarea{min-height:85px}dialog{border:1px solid #d8cbb9;border-radius:20px;background:#f9f5ee;color:#342e28;width:min(540px,94vw);max-height:88vh;padding:20px;overflow:auto}dialog::backdrop{background:#30271e77}.record img{max-width:100%;max-height:240px;border-radius:12px;object-fit:contain}.record p{margin:5px 0;white-space:pre-wrap;overflow-wrap:anywhere}.pill{display:inline-block;padding:4px 9px;background:#e9e0d1;border-radius:20px;font-size:12px}.done{opacity:.65}.hero{background:#ded0bd;padding:22px;border-radius:20px;margin-bottom:18px}.hero h2{font-size:32px}.empty{text-align:center;padding:25px;color:#756b60}a{color:#655443} @media(min-width:750px){main{padding:30px 30px 100px}.grid{grid-template-columns:repeat(4,1fr)}}@media print{header,nav,.actions,button{display:none!important}main{padding:0}body{background:white}}
</style></head><body><header><small>STABLE & HORSE JOURNAL</small><h1>S&amp;M Equestrian</h1><div class="muted">Dein Stall. Deine Pferde. Dein Alltag.</div></header><main id="main"></main><nav id="nav"></nav><dialog id="editor"><form id="form"><div class="row"><h2 id="formtitle"></h2><button type="button" class="secondary" onclick="editor.close()">✕</button></div><div id="fields"></div><p><button type="submit">Speichern</button></p></form></dialog><input id="restore" type="file" accept="application/json" hidden><script>
const schemas={horses:{name:'Pferde',icon:'♞',fields:[['name','Name'],['breed','Rasse'],['birth','Geburtsdatum','date'],['sex','Geschlecht','select','Wallach|Stute|Hengst'],['height','Stockmaß (cm)','number'],['owner','Besitzer/in'],['box','Box'],['vet','Tierarzt / Notfallkontakt'],['notes','Besonderheiten','textarea'],['photo','Foto','file']]},tasks:{name:'Stallaufgaben',icon:'✓',fields:[['name','Aufgabe'],['horse','Pferd','horse'],['date','Datum','date'],['time','Uhrzeit','time'],['kind','Bereich','select','Misten|Füttern|Weide|Rein-/Rausbringen|Sonstiges'],['status','Status','select','Offen|Erledigt'],['notes','Notizen','textarea']]},feeding:{name:'Fütterung',icon:'♧',fields:[['name','Futtermittel'],['horse','Pferd','horse'],['amount','Menge'],['time','Fütterungszeit','time'],['stock','Bestand / Vorrat'],['notes','Zusätze / Hinweise','textarea']]},health:{name:'Gesundheit',icon:'♡',fields:[['name','Maßnahme'],['horse','Pferd','horse'],['kind','Art','select','Tierarzt|Impfung|Wurmkur|Hufschmied|Medikament|Befund|Sonstiges'],['date','Datum','date'],['next','Folgetermin','date'],['notes','Befund / Dosierung laut Tierarzt','textarea']]},calendar:{name:'Kalender',icon:'▦',fields:[['name','Termin'],['horse','Pferd','horse'],['date','Datum','date'],['time','Uhrzeit','time'],['notes','Ort / Notizen','textarea']]},staff:{name:'Personal & Dienste',icon:'♙',fields:[['name','Name'],['kind','Rolle','select','Mitarbeiter|Pflegebeteiligung|Reitbeteiligung|Sonstiges'],['phone','Kontakt'],['date','Diensttag','date'],['time','Von','time'],['end','Bis','time'],['notes','Aufgaben','textarea']]},finance:{name:'Finanzen',icon:'€',fields:[['name','Bezeichnung'],['horse','Pferd','horse'],['date','Datum','date'],['kind','Art','select','Ausgabe|Einnahme'],['amount','Betrag (€)','decimal'],['category','Kategorie','select','Stallmiete|Futter|Versicherung|Tierarzt|Ausrüstung|Sonstiges'],['notes','Notizen','textarea']]},training:{name:'Trainingstagebuch',icon:'☆',fields:[['name','Trainingseinheit'],['horse','Pferd','horse'],['date','Datum','date'],['kind','Disziplin','select','Bodenarbeit|Dressur|Longieren|Gelände|Springen|Spazieren|Sonstiges'],['duration','Minuten','number'],['notes','Verlauf / Fortschritte / Ziele','textarea']]},documents:{name:'Dokumente',icon:'▤',fields:[['name','Dokumentname'],['horse','Pferd','horse'],['kind','Art','select','Equidenpass|Versicherung|Vertrag|Befund|Sonstiges'],['file','Datei (PDF oder Bild)','file'],['notes','Notizen','textarea']]},shows:{name:'Turniere',icon:'♕',fields:[['name','Turnier'],['horse','Pferd','horse'],['date','Datum','date'],['place','Ort'],['class','Prüfung'],['notes','Nennung / Ergebnisse','textarea']]}};
const key='sm-equestrian-v1';let db={};let page='home',editing=null;const main=document.getElementById('main'),editor=document.getElementById('editor'),form=document.getElementById('form');let storageError=false;try{db=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){storageError=true}for(const k in schemas)if(!Array.isArray(db[k]))db[k]=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};const fmt=s=>s? s.split('-').reverse().join('.'):'–';const money=n=>Number(n||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'});function save(){try{localStorage.setItem(key,JSON.stringify(db));return true}catch(e){alert('Speicher nicht verfügbar oder voll. Bitte exportiere eine Sicherung.');return false}}function go(p){page=p;render();window.scrollTo(0,0)}function horseName(id){return db.horses.find(h=>h.id===id)?.name||'–'}function tile(k){let s=schemas[k];return `<button class="tile" onclick="go('${k}')"><span>${s.icon}</span><b>${esc(s.name)}</b><span class="muted">${db[k].length} Einträge</span></button>`}function upcoming(){return ['calendar','tasks','health','staff','shows'].flatMap(k=>db[k].flatMap(r=>[r.date,...(k==='health'?[r.next]:[])].filter(Boolean).filter(d=>d>=today()).filter(()=>r.status!=='Erledigt').map(d=>({k,r,d})))).sort((a,b)=>a.d.localeCompare(b.d)).slice(0,8)}function render(){document.getElementById('nav').innerHTML=[['home','⌂','Heute'],['horses','♞','Pferde'],['tasks','✓','Stall'],['calendar','▦','Kalender'],['more','☰','Mehr']].map(([k,i,n])=>`<button class="${page===k?'active':''}" onclick="go('${k}')"><span>${i}</span>${n}</button>`).join('');if(page==='home'){main.innerHTML=`<div class="hero"><div class="muted">${new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><h2>Willkommen im Stall</h2><p>Alles Wichtige auf einen Blick.</p></div>${storageError?'<p>Lokaler Speicher konnte nicht gelesen werden.</p>':''}<div class="grid">${['horses','tasks','feeding','health'].map(tile).join('')}</div><h3>Anstehende Termine & Aufgaben</h3>${upcoming().map(({k,r,d})=>`<div class="panel row"><div><b>${esc(r.name)}</b><div class="muted">${fmt(d)} · ${esc(schemas[k].name)} ${r.horse?' · '+esc(horseName(r.horse)):''}</div></div><button class="secondary" onclick="edit('${k}','${r.id}')">Öffnen</button></div>`).join('')||'<div class="panel empty">Noch keine anstehenden Termine.</div>'}<h3>Alle Bereiche</h3><div class="grid">${Object.keys(schemas).map(tile).join('')}</div>`;return}if(page==='more'){main.innerHTML=`<h2>Alle Bereiche</h2><div class="grid">${Object.keys(schemas).map(tile).join('')}</div><div class="panel"><h3>Datensicherung</h3><p class="muted">Deine Daten bleiben in diesem Browser. Kein automatischer Geräteabgleich.</p><div class="actions"><button onclick="backup()">Sicherung exportieren</button><button class="secondary" onclick="document.getElementById('restore').click()">Importieren</button></div></div>`;return}if(page==='sign'){return}let s=schemas[page];let records=[...db[page]].sort((a,b)=>(a.date||'').localeCompare(b.date||''));let extra='';if(page==='finance'){let m=today().slice(0,7),r=records.filter(x=>(x.date||'').startsWith(m)),inc=r.filter(x=>x.kind==='Einnahme').reduce((a,x)=>a+Number(x.amount||0),0),out=r.filter(x=>x.kind==='Ausgabe').reduce((a,x)=>a+Number(x.amount||0),0);extra=`<div class="panel"><div class="muted">Aktueller Monat</div><div class="grid"><div>Einnahmen<br><b>${money(inc)}</b></div><div>Ausgaben<br><b>${money(out)}</b></div><div>Saldo<br><b>${money(inc-out)}</b></div></div></div>`}main.innerHTML=`<div class="row"><h2>${s.icon} ${esc(s.name)}</h2><button onclick="edit('${page}')">+ Neu</button></div>${extra}<label>Einträge durchsuchen</label><input id="search" placeholder="Suchen …" oninput="filterRecords()"><div style="height:12px"></div><div id="records">${records.map(r=>record(page,r)).join('')||'<div class="panel empty">Noch keine Einträge. Erstelle deinen ersten Eintrag.</div>'}</div>`}function record(k,r){let s=schemas[k];return `<article class="panel record ${r.status==='Erledigt'?'done':''}" data-search="${esc(Object.values(r).filter(v=>typeof v==='string'&&!v.startsWith('data:')).join(' ').toLowerCase()+' '+horseName(r.horse).toLowerCase())}">${r.photo?.startsWith('data:image/')?`<img src="${esc(r.photo)}" alt="Pferdefoto">`:''}<div class="row"><h3>${esc(r.name)}</h3>${r.status?`<span class="pill">${esc(r.status)}</span>`:''}</div>${s.fields.filter(([f,l,t])=>f!=='name'&&t!=='file'&&r[f]).map(([f,l,t])=>`<p><span class="muted">${esc(l)}:</span> ${esc(t==='horse'?horseName(r[f]):t==='date'?fmt(r[f]):t==='decimal'?money(r[f]):r[f])}</p>`).join('')}${r.file?`<p><button class="secondary" onclick="openFile('${k}','${r.id}')">Datei öffnen / speichern</button></p>`:''}<div class="actions" style="margin-top:12px"><button class="secondary" onclick="edit('${k}','${r.id}')">Bearbeiten</button>${k==='tasks'?`<button class="secondary" onclick="toggle('${r.id}')">${r.status==='Erledigt'?'Wieder öffnen':'Erledigen'}</button>`:''}${k==='horses'?`<button class="secondary" onclick="sign('${r.id}')">Boxenschild</button>`:''}<button class="danger" onclick="removeRecord('${k}','${r.id}')">Löschen</button></div></article>`}function filterRecords(){let q=document.getElementById('search').value.toLowerCase();document.querySelectorAll('.record').forEach(e=>e.hidden=!e.dataset.search.includes(q))}function edit(k,id){let r=db[k].find(x=>x.id===id)||{};editing={k,id,r};document.getElementById('formtitle').textContent=(id?'Bearbeiten: ':'Neu: ')+schemas[k].name;document.getElementById('fields').innerHTML=schemas[k].fields.map(([f,l,t,o])=>{let v=r[f]??(t==='date'&&f==='date'?today():'');let field=t==='textarea'?`<textarea name="${f}">${esc(v)}</textarea>`:t==='select'||t==='horse'?`<select name="${f}">${(t==='horse'?[['','Kein Pferd'],...db.horses.map(h=>[h.id,h.name])]:o.split('|').map(x=>[x,x])).map(([a,b])=>`<option value="${esc(a)}" ${v===a?'selected':''}>${esc(b)}</option>`).join('')}</select>`:t==='file'?`<input name="${f}" type="file" accept="${f==='photo'?'image/*':'application/pdf,image/*'}"><small class="muted">${v?'Datei vorhanden. Neue Auswahl ersetzt sie.':'Maximal 2 MB pro Datei.'}</small>`:`<input name="${f}" type="${t==='decimal'?'number':t||'text'}" ${t==='decimal'?'step="0.01" min="0"':''} ${t==='number'?'min="0"':''} ${f==='name'?'required':''} value="${esc(v)}">`;return `<label>${esc(l)}</label>${field}`}).join('');editor.showModal()}function readFile(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}form.onsubmit=async e=>{e.preventDefault();let {k,id,r}=editing;let entry={...r,id:id||('r'+Date.now().toString(36)+Math.random().toString(36).slice(2,7))};for(let [f,l,t] of schemas[k].fields){let el=form.elements[f];if(t==='file'){if(el.files[0]){if(el.files[0].size>2*1024*1024){alert('Datei ist zu groß (max. 2 MB).');return}entry[f]=await readFile(el.files[0]);entry[f+'Name']=el.files[0].name}}else entry[f]=el.value}let old=db[k];db[k]=id?old.map(x=>x.id===id?entry:x):[...old,entry];if(!save()){db[k]=old;return}editor.close();render()};function removeRecord(k,id){if(!confirm('Eintrag wirklich löschen?'))return;let old=db[k];db[k]=old.filter(x=>x.id!==id);if(!save())db[k]=old;render()}function toggle(id){let r=db.tasks.find(x=>x.id===id),old=r.status;r.status=old==='Erledigt'?'Offen':'Erledigt';if(!save())r.status=old;render()}function sign(id){let h=db.horses.find(x=>x.id===id);page='sign';main.innerHTML=`<div class="panel" style="text-align:center"><small>S&amp;M EQUESTRIAN · BOXENSCHILD</small><h2 style="font-size:40px">${esc(h.name)}</h2>${h.photo?.startsWith('data:image/')?`<img style="max-width:90%;max-height:220px;border-radius:12px" src="${esc(h.photo)}">`:''}<p>${esc(h.breed)} · ${esc(h.sex)}</p><p>Box: ${esc(h.box||'–')}</p><p>Geboren: ${fmt(h.birth)}</p><p>Besitzer/in: ${esc(h.owner||'–')}</p><p>Notfallkontakt: ${esc(h.vet||'–')}</p><p>${esc(h.notes||'')}</p></div><div class="actions"><button onclick="window.print()">Drucken / PDF</button><button class="secondary" onclick="go('horses')">Zurück</button></div><p class="muted">Ein öffentlich abrufbarer QR-Code benötigt später eine Online-Adresse.</p>`}function openFile(k,id){let r=db[k].find(x=>x.id===id);if(!r?.file?.startsWith('data:'))return;let a=document.createElement('a');a.href=r.file;a.download=r.fileName||'Dokument';a.click()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='SM-Equestrian-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}document.getElementById('restore').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!Object.keys(schemas).every(k=>Array.isArray(d[k])&&d[k].every(r=>r&&typeof r.name==='string'&&typeof r.id==='string'&&/^r[a-z0-9]+$/.test(r.id))))throw Error();if(!confirm('Alle aktuellen Einträge durch die Sicherung ersetzen?'))return;let old=db;db=d;if(!save())db=old;render()}catch(err){alert('Ungültige Sicherungsdatei.')}finally{e.target.value=''}};render();
</script></body></html>
